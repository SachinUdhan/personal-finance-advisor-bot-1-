{% extends "base.html" %}

{% block title %}Log In — Personal Finance Advisor Bot{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.5rem;">₹</div>
      <h2 style="font-size: 1.75rem; font-weight: 700;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Sign in to your financial control center</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" id="btn-submit-login" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      <span style="color: var(--text-muted); font-size: 0.9rem;">Don't have an account yet? </span>
      <a href="{{ url_for('auth.register') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
